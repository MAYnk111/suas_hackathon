name: sudha_app
description: SUDHA mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # SUDHA Core Dependencies
  provider: ^6.1.2
  fl_chart: ^0.66.2
  image_picker: ^1.1.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  url_launcher: ^6.2.4
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  audioplayers: ^6.0.0
  cupertino_icons: ^1.0.6
  
  # Pregnancy Role Module Dependencies (from Vatsalya)
  flutter_riverpod: ^2.4.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.2.4
  lottie: ^3.0.0
  intl: ^0.20.2
  timezone: ^0.9.2
  riverpod_annotation: ^2.3.3
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  flutter_markdown: ^0.7.7+1
  flutter_staggered_grid_view: ^0.7.0
  pdf: ^3.10.7
  printing: ^5.12.0
  sqflite: ^2.3.0
  google_generative_ai: ^0.4.0
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1
  
  # Pregnancy Role Module Build Tools
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  riverpod_generator: ^2.3.9


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/sudha_logo.png
  android: true
  ios: true
  web: false

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/sudha_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/sudha_logo.png"

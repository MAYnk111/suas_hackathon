name: sudha_app
description: SUDHA mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  fl_chart: ^0.66.2
  image_picker: ^1.1.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  url_launcher: ^6.2.4
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/sudha_logo.png
  android: true
  ios: true
  web: false

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/sudha_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/sudha_logo.png"
